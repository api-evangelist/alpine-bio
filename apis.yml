name: Alpine Bio
description: Alpine Bio is a molecular-farming biotechnology company (formerly Nobell
  Foods and Alpine Roads), founded in 2016 and based in South San Francisco, California.
  It produces next-generation protein ingredients and bioactives from plants using
  advanced purification and molecular farming, having expressed more than 15 complex
  proteins including the world's first plant-derived casein, fractionated soy protein
  isolates, and activated iron-loaded lactoferrin. The company sells high-purity,
  clean-label ingredients to food and beverage formulators for applications such as
  protein shakes, bars, coffee creamers, iron supplements, yogurt, and clear protein
  sodas, and markets animal-free dairy products under the Nobell Foods brand. It is
  a portfolio company of a16z surfaced in the API Evangelist network; Alpine Bio
  publishes no public developer API, SDK, or developer portal at this time.
